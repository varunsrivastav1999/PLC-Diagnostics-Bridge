name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -e backend/

    - name: Run Pytest
      run: |
        cd backend
        pytest -v

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install and Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate Docker Compose Build
      run: |
        docker compose build

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
    - uses: actions/checkout@v4

    - name: Check Deployment Configuration
      id: check_secrets
      run: |
        if [ -z "${{ secrets.SERVER_HOST }}" ]; then
          echo "::warning title=Remote Deployment Secrets Not Set::SERVER_HOST is not configured in GitHub Repository Secrets. Automatic remote deployment was skipped. To enable automatic deployment to your server, add SERVER_HOST, SERVER_USER, and SERVER_SSH_KEY to Settings -> Secrets and variables -> Actions."
          echo "configured=false" >> $GITHUB_OUTPUT
        else
          echo "configured=true" >> $GITHUB_OUTPUT
        fi

    - name: Deploy via SSH to Server
      if: steps.check_secrets.outputs.configured == 'true'
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          TARGET_DIR="${{ secrets.DEPLOY_PATH || '~/PLC-Diagnostics-Bridge' }}"
          echo "Navigating to deployment directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          echo "Ensuring deployment script is executable..."
          chmod +x scripts/deploy.sh
          
          echo "Executing Docker deployment process..."
          ./scripts/deploy.sh
